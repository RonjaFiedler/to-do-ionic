<ion-header>
  <ion-toolbar>
    <ion-title>Todos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-list>
    <ion-item *ngFor="let todo of todos"
              [style.--background]="getColor(todo.priority)">

      <ion-label>
        <h2>{{ todo.todo }}</h2>
      </ion-label>

      <ion-button (click)="toggle(todo)">
        done
      </ion-button>

      <ion-button color="danger" (click)="delete(todo.id)">
        delete
      </ion-button>

    </ion-item>
  </ion-list>

  <ion-footer>
  <ion-toolbar>
    <ion-button expand="block" color="success" fill="outline" (click)="openForm()">
      Add Todo
    </ion-button>
  </ion-toolbar>
</ion-footer>

</ion-content>
