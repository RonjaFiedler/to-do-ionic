
<ion-header>
  <ion-toolbar>
    <ion-title>New Todo</ion-title>

    <ion-buttons slot="end">
      <ion-button color="danger" (click)="close()">
        Close
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-input
      label="Description"
      labelPlacement="stacked"
      placeholder="Enter your todo"
      [(ngModel)]="todoText">
    </ion-input>
  </ion-item>

  <ion-item>
    <ion-select
      label="Priority"
      placeholder="Select priority"
      [(ngModel)]="priority">

      <ion-select-option [value]="1">1 - Highest</ion-select-option>
      <ion-select-option [value]="2">2</ion-select-option>
      <ion-select-option [value]="3">3</ion-select-option>
      <ion-select-option [value]="4">4</ion-select-option>
      <ion-select-option [value]="5">5 - Lowest</ion-select-option>

    </ion-select>
  </ion-item>

  <ion-button expand="block" (click)="addTodo()">
    Save
  </ion-button>
</ion-content>
